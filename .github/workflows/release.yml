name: Release binaries
on:
  pull_request:
    paths:
      - 'src/**'
      - 'runner/**'
      - 'tests/**'
      - 'shared/control/**'
      - 'shared/core/**'
      - 'Cargo.*'
      - 'phone/**'
      - '.github/workflows/release.yml'
      - 'install.sh'
      - 'scripts/**'
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify shared source
        run: python3 scripts/verify-shared.py
      - name: Install pinned Android compiler packages
        run: '{ yes || :; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Rebuild source adapter using pinned JDK
        run: |
          mkdir -p runner/build/classes
          docker run --rm --cpus=1 --memory=768m -v "$PWD/runner:/work" -v "$ANDROID_HOME:/sdk:ro" -w /work eclipse-temurin:17-jdk@sha256:5d6042fb8cdc14d614e4e421f52e3211fc5aeadddce44cbf9de8ed37c791f824 sh -c 'javac --release 8 -cp /sdk/platforms/android-36/android.jar -d build/classes src/com/androiduse/Runner.java && java -Xmx384m -cp /sdk/build-tools/36.0.0/lib/d8.jar com.android.tools.r8.D8 --min-api 26 --lib /sdk/platforms/android-36/android.jar --output build build/classes/com/androiduse/Runner*.class'
          cmp runner/build/classes.dex runner/adapter.dex
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - runner: macos-14
            target: x86_64-apple-darwin
            name: darwin-x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            name: darwin-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test shared core, Android protocol, CLI and MCP
        run: cargo test --workspace --locked
      - name: Test installer
        if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - name: Clippy
        run: cargo clippy -p phone-control -p android-use -p android-use-phone --all-targets --locked -- -D warnings
      - name: Build
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build -p android-use --release --target ${{ matrix.target }} --locked
      - name: Verify Windows runtime dependencies
        if: runner.os == 'Windows'
        run: python scripts/check-windows-imports.py target/${{ matrix.target }}/release/android-use.exe
      - name: Package binaries and checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET_PLATFORM: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p dist package
          binary=android-use
          if [[ "$TARGET" == *windows* ]]; then binary=android-use.exe; fi
          cp "target/$TARGET/release/$binary" package/
          cp THIRD-PARTY-NOTICES.md LICENSE package/
          tar -czf "dist/android-use-$ASSET_PLATFORM.tar.gz" -C package .
          python3 - <<'PY'
          import hashlib, pathlib
          for p in pathlib.Path('dist').glob('*.tar.gz'):
              p.with_name(p.name+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          PY
      - name: Test Windows installer against the built archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1 -Archive dist/android-use-windows-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: android-use-${{ matrix.name }}
          path: dist/*
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install Android build tools and NDK
        run: '{ yes || :; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"'
      - name: Prepare release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.ANDROID_PHONE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          value = os.environ.get('KEYSTORE', '')
          if not value:
              raise SystemExit('Configure ANDROID_PHONE_KEYSTORE_BASE64 and signing password secrets before an APK release')
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'phone.keystore'
          p.write_bytes(base64.b64decode(value, validate=True))
          p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('PHONE_KEYSTORE=' + str(p) + '\n')
          PY
      - name: Build companion APK
        env:
          PHONE_STORE_PASS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_PHONE_STORE_PASS || 'android' }}
          PHONE_KEY_PASS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_PHONE_KEY_PASS || 'android' }}
        run: phone/build.sh
      - name: Validate 16 KiB page alignment
        run: '"$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 phone/build/android-use-phone-arm64.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: android-use-phone-arm64
          path: |
            phone/build/android-use-phone-arm64.apk
            phone/build/android-use-phone-arm64.apk.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-adapter, phone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$TAG" = "v$version"
          gh release create "$TAG" dist/* --verify-tag --draft --title "android-use $version" --notes-file RELEASE-NOTES.md
