[package]
name = "phone-control"
version = "0.1.0"
edition = "2021"

[dependencies]
iu_core = { package = "core", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
